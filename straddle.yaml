# upnp — UPnP IGD port mapping for spangap.
schema_version: 1
name: spangap/upnp
prefix: upnp
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: the generated dispatcher constructs UpnpService and calls its
# onInit() in the straddle band. onInit() registers net-event callbacks, a cron
# entry, and a CLI verb — net/storage/cron/cli are all up by the time it runs.
services:
  - { class: UpnpService, header: upnp.h }
# The UPnP pane's web half is now generated from the `settings:` block below
# (registered via the buildable's straddles.gen.ts registerGeneratedPanels),
# so this straddle no longer ships a browser module / browser_register hook.

# Declarative settings: the UPnP pane (LCD + web + storage defaults from one
# source). Fully static, so no hand-written upnp_lcd.cpp / UpnpPanel.vue /
# storageDefault() trio.
settings:
  - menu:
      - { id: network, label: "Internet", placement: 2 }
      - { id: upnp, label: "UPnP" }
    rows:
      - section: "UPnP"
      - switch: { label: "Enable", key: "s.upnp.enable", default: 0 }
      - text:   { label: "External port", key: "s.upnp.ext_port", default: 0 }
      - caption: "0 uses the same port as the device HTTPS listener (s.net.https_port). The device maps TCP for HTTPS and UDP for WebRTC (s.net.webrtc_port)."

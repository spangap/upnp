# upnp — UPnP IGD port mapping for spangap.
schema_version: 1
name: spangap/upnp
prefix: upnp
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
optional_requires:
  # On-device UPnP settings pane — conditional/spangap-lcd/src/upnp_lcd.cpp,
  # compiled only when spangap-lcd is staged and registered via the
  # when:-gated upnpLcdRegister init hook.
  - spangap/spangap-lcd
# Auto-init: folded into the buildable's generated spangapInitStraddles().
# upnpInit() registers net-event callbacks, a cron entry, and a CLI verb —
# net/storage/cron/cli are all up by the time the straddle band runs.
init:
  - call: upnpInit
  - call: upnpLcdRegister
    when: spangap/spangap-lcd

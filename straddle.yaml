# upnp — UPnP IGD port mapping for spangap.
schema_version: 1
name: spangap/upnp
prefix: upnp
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
optional_requires:
  # upnp.cpp registers on-device Settings panes via spangap-lcd's
  # lcdSetting* helpers, gated on CONFIG_SPANGAP_LCD.
  - spangap/spangap-lcd
# Auto-init: folded into the buildable's generated spangapInitStraddles().
# upnpInit() registers net-event callbacks, a cron entry, and a CLI verb —
# order-independent once net/storage/cron/cli are up. Default order (100).
init:
  - call: upnpInit

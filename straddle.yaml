# upnp — UPnP IGD port mapping for spangap.
schema_version: 1
name: spangap/upnp
prefix: upnp
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: folded into the buildable's generated spangapInitStraddles().
# upnpInit() registers net-event callbacks, a cron entry, and a CLI verb —
# net/storage/cron/cli are all up by the time the straddle band runs.
init:
  - call: upnpInit
  - call: upnpLcdRegister
    when: spangap/spangap-lcd
# Browser auto-registration (parallel to init:): staging upnp into a browser
# buildable imports registerUpnp (upnp/modules/upnp) into straddles.gen.ts and
# injects the file: dep — the UPnP pane appears under Settings → Network with
# no consumer edit.
browser_register:
  - call: registerUpnp

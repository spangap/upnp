# upnp — UPnP IGD port mapping for spangap.
schema_version: 1
name: spangap/upnp
prefix: upnp
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: the generated dispatcher constructs UpnpService and calls its
# onInit() in the straddle band. onInit() registers net-event callbacks, a cron
# entry, and a CLI verb — net/storage/cron/cli are all up by the time it runs.
services:
  - { class: UpnpService, header: upnp.h }
# The UPnP pane's web half is now generated from the `settings:` block below
# (registered via the buildable's straddles.gen.ts registerGeneratedPanels),
# so this straddle no longer ships a browser module / browser_register hook.

# Declarative settings: the UPnP pane (LCD + web + storage defaults from one
# source). Fully static, so no hand-written upnp_lcd.cpp / UpnpPanel.vue /
# storageDefault() trio.
settings:
  - at:
      - { id: net }
      - { id: reachable }
    order: 2
    rows:
      - heading: "UPnP"
      - caption: "Your home router is often reachable from the internet. We just need to make sure it knows to connect to this device when someone connects to it. UPnP automates that. Some routers have it turned on by default, sometimes you have to allow it in your router's settings. Or you can forward a port directly if this device's IP on your network is fixed."
      - switch: { label: "Enable UPnP", key: "s.upnp.enable", default: 0 }
      # No default here: upnp.cpp seeds it from the HTTPS port the web server is
      # actually configured for, which is a number only the device knows.
      - integer: { label: "External port", key: "s.upnp.ext_port", min: 1, max: 65535 }
      - switch: { label: "Forward port 80 also", key: "s.upnp.fwd_http", default: 0 }
